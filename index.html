<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp Kotoba</title>
<meta name="theme-color" content="#a3281f">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}
body{font:500 16px/1.5 'Zen Maru Gothic',system-ui,sans-serif;background:var(--bg);color:#27231f;min-height:100vh;padding-bottom:84px;transition:background .6s}
body[data-s=fuyu]{--bg:#e8eff7;--paper:#fbfdff;--ink:#2b4f86;--soft:#d3e2f3}
body[data-s=haru]{--bg:#fcedf1;--paper:#fffafb;--ink:#c2365f;--soft:#f8d9e2}
body[data-s=natsu]{--bg:#e5f4f1;--paper:#fafffe;--ink:#0f7f86;--soft:#c8e9e4}
body[data-s=aki]{--bg:#f1e1da;--paper:#fffaf7;--ink:#a3281f;--soft:#ebc8bb}
h1,h2,h3,.kj,.hk{font-family:'Shippori Mincho',serif}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fx span{position:absolute;top:-30px;opacity:.45;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#login,#app>*:not(nav){position:relative;z-index:1}
#login{min-height:100vh;display:grid;align-content:center;justify-items:center;gap:10px;padding:24px;text-align:center}
.seal{width:84px;height:84px;display:grid;place-items:center;font:800 44px 'Shippori Mincho',serif;color:var(--paper);background:var(--ink);border-radius:50%;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--ink);transform:rotate(-8deg)}
h1{font-size:34px;color:var(--ink);letter-spacing:.08em}
.sub{opacity:.7;margin-bottom:12px}
form{display:grid;gap:10px;width:min(320px,100%)}
input{font:inherit;padding:13px 14px;border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:12px;background:var(--paper);color:inherit;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{font:700 16px 'Zen Maru Gothic',sans-serif;padding:13px 18px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer;width:100%}
.btn.ghost,.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.5}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
header small{display:block;opacity:.65;font-size:12px}
header .ghost{padding:6px 12px;border-radius:10px;font:700 13px 'Zen Maru Gothic',sans-serif;cursor:pointer}
.pn{padding:4px 16px 16px;max-width:520px;margin:0 auto}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mon>div{text-align:center}
.mon button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-size:22px;cursor:pointer}
.kj{display:block;font-size:46px;line-height:1;color:var(--ink);font-weight:800}
h2{font-size:20px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.c{aspect-ratio:1;position:relative;background:var(--paper);border:1px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:12px;padding:0;cursor:pointer;font:inherit;color:inherit}
.c:disabled{cursor:default}
.c.today{border:2px solid var(--ink)}
.c i{position:absolute;top:3px;left:6px;font:700 10px 'Zen Maru Gothic';font-style:normal;opacity:.5}
.c b{position:absolute;right:3px;bottom:2px;font:700 11px 'Zen Maru Gothic';background:var(--ink);color:#fff;border-radius:9px;padding:0 6px}
.hk{--rot:0deg;position:absolute;inset:8px;border-radius:50%;border:2.5px solid var(--ink);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:clamp(15px,5.5vw,24px);background:color-mix(in srgb,var(--ink) 9%,transparent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--ink);transform:rotate(var(--rot))}
.hk.new{animation:press .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes press{from{transform:scale(2.4) rotate(var(--rot));opacity:0}to{transform:scale(1) rotate(var(--rot));opacity:1}}
.sum{margin-top:14px;text-align:center;opacity:.8}
.sum b{color:var(--ink);font-size:18px}
.hint{text-align:center;opacity:.7;margin:10px 0 16px}
#reader{width:100%;border-radius:14px;overflow:hidden;margin:0 0 10px}
#sn{color:var(--ink);text-align:center;margin:8px 0}
#qrk{display:grid;place-items:center;width:200px;height:200px;margin:0 auto 8px;background:#fff;border-radius:16px;border:2px solid var(--ink)}
.kode{display:flex;justify-content:center;gap:8px;margin:18px 0}
.kode span{width:54px;height:72px;display:grid;place-items:center;font:800 38px 'Shippori Mincho',serif;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:0 0 0 4px var(--soft)}
.kin{text-align:center;font:800 32px 'Shippori Mincho',serif;letter-spacing:.35em;text-transform:uppercase;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;padding:12px 14px;margin-top:8px;background:var(--paper);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:12px;color:inherit;cursor:pointer}
.row span{font:700 13px 'Zen Maru Gothic';color:var(--ink);white-space:nowrap}
.row.done{cursor:default;background:#e8f5ec;border-color:#86c79b}
.row.done span{color:#187a42}
h4 small{font:700 12px 'Zen Maru Gothic',sans-serif;color:#187a42;margin-left:6px}
h4{margin:16px 0 0;color:var(--ink);font:800 15px 'Shippori Mincho',serif}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 10px;border:0;background:none;font:700 12px 'Zen Maru Gothic',sans-serif;color:#27231f;opacity:.55;cursor:pointer}
nav button b{display:block;font:800 22px 'Shippori Mincho',serif;line-height:1.1}
nav button.on{opacity:1;color:var(--ink)}
#sv{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;padding:0 16px 40px}
#sv .in{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding:14px 0}
.top button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-size:20px;cursor:pointer}
#modal{position:fixed;inset:0;z-index:10;background:rgba(20,16,14,.5);display:grid;align-items:end}
#modal>div{background:var(--paper);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto;display:grid;gap:10px}
#modal h3{color:var(--ink);font-size:22px}
.ls{padding-left:20px}
#boom{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:rgba(255,255,255,.55);pointer-events:none}
#boom .hk{position:static;width:190px;height:190px;font-size:96px;background:var(--paper);animation:press .5s cubic-bezier(.2,1.5,.4,1) both}
#boom p{position:absolute;bottom:30%;font:800 22px 'Shippori Mincho',serif;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:20;background:#27231f;color:#fff;padding:10px 16px;border-radius:12px;max-width:88%;text-align:center}
.row.rw{cursor:default}
.tt{flex:1;min-width:0}
.ac{display:flex;gap:8px;align-items:center;flex-shrink:0}
.ac button{font:700 13px 'Zen Maru Gothic',sans-serif;padding:7px 10px;border-radius:9px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.ac button.pri{background:var(--ink);color:#fff}
#kv{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:0 8px 40px}
#kv .in{max-width:900px;margin:0 auto}
.ktw{background:var(--paper);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:12px;overflow:hidden;margin-top:8px}
.kt{width:100%;border-collapse:collapse;table-layout:fixed}
.kt th{position:sticky;top:0;z-index:1;background:var(--soft);color:var(--ink);text-align:left;font:800 12px 'Zen Maru Gothic',sans-serif;padding:7px 6px;border-bottom:2px solid var(--ink)}
.kt td{padding:8px 6px;vertical-align:top;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent);word-break:break-word;font-size:14px;line-height:1.35;cursor:pointer}
.kt tr:nth-child(even) td{background:color-mix(in srgb,var(--soft) 35%,transparent)}
.kt td.n{text-align:center;opacity:.55;font-size:12px;padding-left:2px;padding-right:2px}
.kt .kjp{font:800 17px 'Shippori Mincho',serif;color:var(--ink)}
.kt .kro{opacity:.8;font-size:13px}
#kv.hr .kro:not(.show),#kv.ha .kid:not(.show){filter:blur(7px);user-select:none}
.tot{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px}
.tot small{display:block;opacity:.8;font-size:12px}
.tot b{font:800 30px 'Shippori Mincho',serif;line-height:1}
.hi{--rot:0deg;position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:contain;transform:rotate(var(--rot));filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3));pointer-events:none}
.hi.new{animation:press .5s cubic-bezier(.2,1.5,.4,1) both}
#boom .hi{position:static;width:210px;height:210px;animation:press .5s cubic-bezier(.2,1.5,.4,1) both}
.fl{display:grid;gap:4px;font:700 14px 'Zen Maru Gothic',sans-serif;color:var(--ink)}
.hi.rare{filter:drop-shadow(0 0 5px #f5b800) drop-shadow(0 0 2px #fff3b8)}
#boom.rare{background:rgba(255,246,205,.8)}
#boom.rare .hi{filter:drop-shadow(0 0 18px #f5b800) drop-shadow(0 0 6px #fff3b8)}
#boom p{text-align:center;padding:0 14px}
#boom.rare p{color:#8a5d00}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:48vh;overflow:auto;padding:2px}
.tb{position:relative;aspect-ratio:1;background:var(--paper);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:10px;padding:0;cursor:pointer}
.tb.rr{border:2px solid #f5b800}
.tb small{position:absolute;bottom:1px;right:4px;font:700 10px 'Zen Maru Gothic',sans-serif;opacity:.6}
.c.rr{background:radial-gradient(circle at 50% 45%,#fff6cf 0%,var(--paper) 78%);border:1px solid #f5b800;box-shadow:0 0 8px rgba(245,184,0,.45)}
#boom p small{font-size:14px}
#spf{display:block;width:100%;height:calc(100vh - 190px);min-height:420px;border:0;border-radius:14px;background:#fff}
.sk{border:0;border-top:2px dashed color-mix(in srgb,var(--ink) 40%,transparent);margin:14px 0 4px}
h4.ds{margin:10px 0 0}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.cl{position:relative;aspect-ratio:1;background:var(--paper);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:12px}
.cl.rr{border:2px solid #f5b800;box-shadow:0 0 8px rgba(245,184,0,.35)}
.cl small{position:absolute;left:5px;bottom:2px;font:700 10px 'Zen Maru Gothic',sans-serif;opacity:.5}
.cl b{position:absolute;right:3px;top:3px;background:var(--ink);color:#fff;font:700 11px 'Zen Maru Gothic',sans-serif;border-radius:9px;padding:0 6px}
.cl.lock{background:color-mix(in srgb,var(--soft) 45%,transparent);border-style:dashed}
.cl.lock .hi{filter:brightness(0) opacity(.15)}
.cl.lock span{position:absolute;inset:0;display:grid;place-items:center;font:800 26px 'Shippori Mincho',serif;color:var(--ink);opacity:.4}
.seg{display:flex;gap:8px;margin:4px 0 14px}
.seg button{flex:1;padding:11px 6px;border-radius:12px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font:700 14px 'Zen Maru Gothic',sans-serif;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.kf{display:grid;gap:12px;margin-top:8px}
.kf label{display:grid;gap:4px;font:700 14px 'Zen Maru Gothic',sans-serif;color:var(--ink)}
.kf .hint{margin:0;color:#a3281f}
@keyframes rot{to{transform:rotate(360deg)}}
nav button.spin b{animation:rot .8s linear infinite}
@media(prefers-reduced-motion:reduce){#fx{display:none}*{animation:none!important}}
</style>
</head>
<body data-s="aki">
<div id="fx"></div>

<main id="login" hidden>
  <div class="seal">印</div>
  <h1>スタンプ帳</h1>
  <p class="sub">Buku stamp hafalan kotoba</p>
  <form id="lf">
    <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none" required>
    <input id="pn" placeholder="PIN" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button class="btn" id="lb">Masuk</button>
  </form>
</main>

<div id="app" hidden>
  <header><div><b id="who"></b><small id="role"></small></div><button class="ghost" id="out">Keluar</button></header>
  <section class="pn" id="p-kartu">
    <div class="mon"><button id="pv" aria-label="Bulan sebelumnya">‹</button><div><span class="kj" id="kj"></span><h2 id="mt"></h2></div><button id="nx" aria-label="Bulan berikutnya">›</button></div>
    <div id="cardbox"></div>
  </section>
  <section class="pn" id="p-minta" hidden>
    <div id="mbox"></div>
  </section>
  <section class="pn" id="p-kode" hidden>
    <h2 style="text-align:center;margin-top:6px">Terima kode siswa</h2>
    <p class="hint">Scan QR di HP siswa, atau ketik kode 5 karakternya.</p>
    <div id="reader"></div>
    <button class="btn" id="cam">Scan QR</button>
    <p id="sn"></p>
    <form id="mf" style="width:100%;margin-top:14px"><input id="mc" class="kin" maxlength="5" placeholder="•••••" autocapitalize="characters" autocomplete="off" required><button class="btn ghost">Cek kode</button></form>
    <button class="btn ghost" id="ujiS" style="margin-top:22px">Uji tampilan stamp</button>
  </section>
  <section class="pn" id="p-siswa" hidden>
    <input id="sq" placeholder="Cari nama siswa">
    <div id="slist"></div>
  </section>
  <section class="pn" id="p-hafalan" hidden>
    <input id="hs" placeholder="Cari hafalan">
    <div id="hl"></div>
  </section>
  <section class="pn" id="p-koleksi" hidden>
    <div class="mon"><button id="kpv" aria-label="Bulan sebelumnya">‹</button><div><span class="kj" id="kkj"></span><h2 id="kmt"></h2></div><button id="knx" aria-label="Bulan berikutnya">›</button></div>
    <div id="kbox"></div>
  </section>
  <section class="pn" id="p-spinner" hidden style="max-width:900px;padding:0 10px 10px">
    <p class="hint" style="margin:0 0 8px;text-align:right"><a href="https://prasuteja-lang.github.io/sakura_spinner/" target="_blank" rel="noopener" style="color:var(--ink);font-weight:700">Buka di browser ↗</a></p>
    <iframe id="spf" title="Sakura Spinner" allow="autoplay; fullscreen; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>
  <nav id="tabs"></nav>
</div>

<div id="sv" hidden><div class="in">
  <div class="top"><button id="sb" aria-label="Kembali">‹</button><h2 id="svn"></h2></div>
  <div id="svc"></div>
  <button class="btn ghost" id="kwb" style="margin-top:18px">＋ Beri stamp Kaiwa Renshuu</button>
  <button class="btn ghost" id="bnb" style="margin-top:8px">✨ Beri stamp Langka (hak istimewa sensei)</button>
  <input id="hq" placeholder="Cari hafalan" style="margin-top:12px">
  <div id="svl"></div>
</div></div>
<div id="kv" hidden><div class="in">
  <div class="top"><button id="kback" aria-label="Kembali">‹</button><h2 id="ktitle"></h2></div>
  <p class="hint" id="kinfo"></p>
  <div class="seg"><button id="khr">Sembunyikan romaji</button><button id="kha">Sembunyikan arti</button></div>
  <div id="klist"></div>
</div></div>
<div id="modal" hidden></div>
<div id="boom" hidden></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const SE={fuyu:['冬','雪','❄️'],haru:['春','桜','🌸'],natsu:['夏','夏','🌻'],aki:['秋','楓','🍁']};
const TABS={siswa:[['kartu','帳','Kartu'],['minta','印','Minta stamp'],['koleksi','集','Koleksi'],['spinner','桜','Spinner']],sensei:[['kode','鍵','Kode'],['siswa','生','Siswa'],['hafalan','語','Kotoba'],['spinner','桜','Spinner']]};
const sOf=m=>m==12||m<3?'fuyu':m<6?'haru':m<9?'natsu':'aki';
const now=new Date();let T=null,ME=null,H=null,CD=null,CUR=null,QR=null,Y=now.getFullYear(),M=now.getMonth()+1;
const ymS=(y,m)=>y+'-'+String(m).padStart(2,'0');
const API='https://script.google.com/macros/s/AKfycbwQ1Nopuf9Zl3vVIfnFctjBN3ylBKOH0UfoUSYSLE5Ieqj0oguqbSa1Dh2JQ4RePDaOmw/exec';
const api=async(fn,...args)=>{let j;try{const r=await fetch(API,{method:'POST',body:JSON.stringify({fn,args})});j=await r.json()}catch(e){throw new Error('Tidak bisa terhubung. Periksa internet Anda.')}if(!j.ok){if(/^Sesi habis/.test(j.error)&&T&&fn!=='login')setTimeout(logout,0);throw new Error(j.error)}return j.data};
const store={get:()=>{try{return localStorage.getItem('stk')}catch(e){return null}},set:v=>{try{v?localStorage.setItem('stk',v):localStorage.removeItem('stk')}catch(e){}}};
const meStore={get:()=>{try{return JSON.parse(localStorage.getItem('stm'))}catch(e){return null}},set:v=>{try{v?localStorage.setItem('stm',JSON.stringify(v)):localStorage.removeItem('stm')}catch(e){}}};
/* cache lokal (semi-offline): tampilkan data lama dulu, lalu perbarui dari server */
const CK='stc:';
const cacheGet=k=>{try{return JSON.parse(localStorage.getItem(CK+k))}catch(e){return null}};
const cacheSet=(k,v)=>{try{localStorage.setItem(CK+k,JSON.stringify(v))}catch(e){}};
const cacheClear=()=>{try{Object.keys(localStorage).filter(k=>k.indexOf(CK)==0).forEach(k=>localStorage.removeItem(k))}catch(e){}};
const ck=(fn,args)=>(ME?ME.username:'')+'|'+fn+'|'+JSON.stringify(args.slice(1));
async function apiS(fn,args,cb){
  const k=ck(fn,args),old=cacheGet(k);
  if(old!==null&&cb)cb(old);
  try{const d=await api(fn,...args);if(old===null||JSON.stringify(d)!==JSON.stringify(old)){cacheSet(k,d);cb&&cb(d)}return d}
  catch(e){if(old!==null)return old;throw e}
}
async function apiF(fn,args){const d=await api(fn,...args);cacheSet(ck(fn,args),d);return d}
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.append(e)}e.textContent=t;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,3500)}
const err=e=>toast(String((e&&e.message)||e).replace(/^Error:\s*/,''));
function theme(m){const s=sOf(m);document.body.dataset.s=s;const fx=$('#fx');fx.innerHTML='';for(let i=0;i<10;i++){const p=document.createElement('span');p.textContent=SE[s][2];p.style.cssText=`left:${Math.random()*100}%;animation-duration:${9+Math.random()*8}s;animation-delay:-${Math.random()*12}s;font-size:${12+Math.random()*12}px`;fx.append(p)}}
function modal(h){const m=$('#modal');m.innerHTML='<div>'+h+'</div>';m.hidden=false;m.onclick=e=>{if(e.target===m)closeM()}}
function closeM(){$('#modal').hidden=true}

const banner=(n,t)=>`<div class="tot"><div>Total kotoba dihafal<small>${t} tema selesai</small></div><b>${n}</b></div>`;
const EXT=['png','gif','webp','jpg','jpeg'],EXI={};
function simg(i,cls,rot,g){const e=EXI[i]||0;return `<img class="hi ${cls||''}" style="--rot:${rot}deg" src="stamp/${i}.${EXT[e]}" data-i="${i}" data-e="${e}" data-n="1" data-g="${g||''}" alt="" onload="EXI[this.dataset.i]=+this.dataset.e" onerror="imgErr(this)">`}
function imgErr(el){const n=+el.dataset.n;
  if(n<EXT.length){const e=(+el.dataset.e+1)%EXT.length;el.dataset.e=e;el.dataset.n=n+1;el.src='stamp/'+el.dataset.i+'.'+EXT[e];return}
  const s=document.createElement('span');s.className='hk';s.textContent=el.dataset.g;s.style.cssText=el.style.cssText;el.replaceWith(s)}
function daftarHari(L){
  const hs=L.filter(s=>s.jenis!='kaiwa'&&s.jenis!='bonus'),kw=L.filter(s=>s.jenis=='kaiwa'),bn=L.filter(s=>s.jenis=='bonus');
  const sec=(t,a,k)=>a.length?`<h4 class="ds">${t}<small>${a.length}</small></h4><ul class="ls">${a.map(s=>`<li>${s.rare?'✨ ':''}${k?'<b>'+esc(s.jam||'')+'</b> · ':''}${esc(s.judul)}</li>`).join('')}</ul>`:'';
  return sec('Kosakata (hafalan)',hs,false)+(hs.length&&kw.length?'<hr class="sk">':'')+sec('Kaiwa Renshuu',kw,true)+(bn.length&&(hs.length||kw.length)?'<hr class="sk">':'')+sec('✨ Hadiah sensei',bn,false);
}
function renderCard(box,d,y,m,fresh){
  const n=new Date(y,m,0).getDate(),by={},g=SE[sOf(m)][1],td=new Date(),tdy=td.getFullYear()==y&&td.getMonth()+1==m?td.getDate():0;
  d.month.forEach(s=>{const k=+s.tanggal.slice(8);(by[k]=by[k]||[]).push(s)});
  let h='<div class="grid">';
  for(let i=1;i<=n;i++){const l=by[i],f=l&&(l.find(x=>x.rare)||l[0]);h+=`<button class="c${i==tdy?' today':''}${f&&f.rare?' rr':''}" ${l?`data-d="${i}"`:'disabled'}><i>${i}</i>${l?`${f.img?simg(f.img,(fresh==i?'new ':'')+(f.rare?'rare':''),(i*37%25)-12,g):`<span class="hk${fresh==i?' new':''}" style="--rot:${(i*37%13)-6}deg">${g}</span>`}${l.length>1?`<b>${l.length}</b>`:''}`:''}</button>`}
  box.innerHTML=banner(d.kotoba||0,d.total)+h+`</div><p class="sum"><b>${d.month.length}</b> stamp bulan ini · <b>${d.total}</b> hafalan selesai · <b>${d.kaiwa||0}</b> kaiwa${d.bonus?` · <b>${d.bonus}</b> hadiah sensei`:''}</p>`;
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>modal(`<h3>${b.dataset.d} ${MN[m-1]}</h3>${daftarHari(by[b.dataset.d])}<button class="btn" onclick="closeM()">Tutup</button>`));
}

function showKode(r){

  $('#mbox').innerHTML=`<p class="hint">Tunjukkan kode ini ke sensei untuk dites.</p><div class="kode">${r.kode.split('').map(c=>`<span>${c}</span>`).join('')}</div><div id="qrk"></div>${r.jenis=='kaiwa'?`<p class="sum"><b>Kaiwa Renshuu</b><br>${esc(r.judul)}<br>${esc(r.tgl)} · ${esc(r.jam)}</p>`:`<p class="sum"><b>${esc(r.judul)}</b></p>`}<p class="sum" id="sisa"></p><button class="btn ghost" id="bt" style="margin-top:18px">Batalkan / ganti hafalan</button>`;
  if(window.QRCode)new QRCode($('#qrk'),{text:r.kode,width:176,height:176,colorDark:'#1c1a18',colorLight:'#ffffff'});
  $('#bt').onclick=async()=>{clearInterval(PT);try{await api('cancelRequest',T)}catch(e){}loadMinta()};
  PT=setInterval(async()=>{
    const s=Math.max(0,Math.round((dl-Date.now())/1000));$('#sisa').textContent='Berlaku '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    if(++n%3||busy)return;busy=true;
    try{if(!(await api('myRequest',T))){clearInterval(PT);const d=await apiF('card',[T,null,r.jenis=='kaiwa'?r.tgl.slice(0,7):ymS(now.getFullYear(),now.getMonth()+1)]);
      const ok=r.jenis=='kaiwa'?d.month.some(s=>s.jenis=='kaiwa'&&s.judul==r.judul&&s.jam==r.jam&&s.tanggal==r.tgl):d.done.includes(r.judul);
      if(ok){boom(d.lastImg,d.lastRare,d.lastNaik);toast('Stamp diterima!')}else toast('Kode sudah kedaluwarsa.');loadMinta()}}catch(e){}
    busy=false},1000);
}

function drawKoleksi(box,d){
  const cnt={};d.month.forEach(s=>{if(s.img)cnt[s.img]=(cnt[s.img]||0)+1});
  const kf=d.kfg||KFG0,biasa=kf.biasa,LANGKA=kf.langka;
  const tile=(i,r)=>{const n=cnt[i]||0;
    if(n)return `<div class="cl${r?' rr':''}">${simg(i,r?'rare':'',0,'楓')}${n>1?`<b>×${n}</b>`:''}<small>${i}</small></div>`;
    return r?`<div class="cl lock rr"><span>？</span></div>`:`<div class="cl lock">${simg(i,'',0,'')}<small>${i}</small></div>`};
  const gb=biasa.filter(i=>cnt[i]).length,gr=LANGKA.filter(i=>cnt[i]).length;
  box.innerHTML=`<div class="tot"><div>Koleksi stamp bulan ini<small>direset setiap bulan</small></div><b>${gb+gr}/${biasa.length+LANGKA.length}</b></div>
  <h4>Stamp biasa<small>${gb}/${biasa.length}</small></h4><div class="cg">${biasa.map(i=>tile(i,false)).join('')}</div>
  <h4>Stamp langka ✨<small>${gr}/${LANGKA.length}</small></h4><div class="cg">${LANGKA.map(i=>tile(i,true)).join('')}</div>`;
}
$('#kpv').onclick=()=>{KM--;if(KM<1){KM=12;KY--}loadKoleksi()};
$('#knx').onclick=()=>{KM++;if(KM>12){KM=1;KY++}loadKoleksi()};
let TAB='';
async function muatUlang(){
  const b=$('#rf');if(!b||b.classList.contains('spin'))return;b.classList.add('spin');
  try{await api('refresh',T)}catch(e){}
  cacheClear();H=null;
  try{await go(TAB);toast('Data diperbarui')}catch(e){err(e)}
  b.classList.remove('spin');
}
function go(t){
  clearInterval(PT);stopScan();document.querySelectorAll('.pn').forEach(p=>p.hidden=p.id!='p-'+t);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  TAB=t;return ({kartu:loadKartu,minta:loadMinta,kode:()=>theme(now.getMonth()+1),siswa:loadSiswa,hafalan:loadHafalan,koleksi:loadKoleksi,spinner:()=>{theme(now.getMonth()+1);const f=$('#spf');if(!f.dataset.l){f.dataset.l=1;f.src='https://prasuteja-lang.github.io/sakura_spinner/'}}})[t]();
}
function enter(){
  $('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=ME.nama;$('#role').textContent=ME.role=='sensei'?'Sensei 先生':'Siswa 生徒';
  const L=TABS[ME.role]||TABS.siswa;$('#tabs').innerHTML=L.map(t=>`<button data-t="${t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join('')+'<button id="rf"><b>↻</b>Muat ulang</button>';
  $('#tabs').querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));$('#rf').onclick=muatUlang;go(L[0][0]);
}
$('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;
  try{const r=await api('login',$('#u').value,$('#pn').value);T=r.token;ME=r.me;store.set(T);meStore.set(ME);enter()}catch(x){err(x)}b.disabled=false};
function logout(){cacheClear();store.set(null);meStore.set(null);T=ME=H=CD=null;clearInterval(PT);stopScan();$('#sv').hidden=true;$('#kv').hidden=true;$('#app').hidden=true;$('#login').hidden=false;$('#pn').value=''}
$('#out').onclick=logout;

(async()=>{theme(M);T=store.get();
  if(T){
    const m=meStore.get();
    if(m){ME=m;enter();api('me',T).then(x=>{ME=x;meStore.set(x)}).catch(()=>{});return}
    try{ME=await api('me',T);meStore.set(ME);enter();return}catch(e){store.set(null)}
  }
  $('#login').hidden=false})();
</script>
</body>
